# panex backend crate: the app (src/main.rs → lib.rs) and the panex-cli hook helper (src/bin).
[package]
name = "panex"
version = "0.4.4"
description = "Open-source, cross-platform terminal for running many AI coding agents"
license = "MIT"
edition = "2021"
default-run = "panex"

[lib]
name = "panex_lib"
crate-type = ["rlib"]

[[bin]]
name = "panex"
path = "src/main.rs"

# Tiny console-subsystem helper called by agent hooks (`panex-cli notify`).
[[bin]]
name = "panex-cli"
path = "src/bin/panex-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "sync", "time"] }
base64 = "0.22"
# kqueue: macOS backend without the extra fsevent-sys dependency (we watch one small dir).
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
# Font picker: pure-Rust font enumeration (no system font API bindings), used only when settings open.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }

# ShellExecuteW for opening links from terminal output without a shell (already in the tree via tauri).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

# Transparent windows on macOS need the private API (enabled in tauri.macos.conf.json).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# Fast iteration build (`cargo tauri build --no-bundle -- --profile test-build`): release without LTO
# and with parallel codegen. Shipped installers still use [profile.release].
[profile.test-build]
inherits = "release"
lto = false
codegen-units = 16
strip = false
opt-level = 1
incremental = true
